<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ILoadList — Equipment Rental Management</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="ab" id="ab"></div>
<div class="pz" id="pz" style="display:none"></div>
<div id="idleBar">&#9203; Inactive &mdash; signing out in <span id="idleCnt">10:00</span>. Move your mouse or press any key to stay.</div>

<!-- ═══════════════════════ LOGIN ═══════════════════════ -->
<script src="sections/login.js"></script>
<div class="scr" id="sApp">
  <!-- SIDEBAR -->
  <div class="sb">
    <div class="sblogo">
      <div class="sblogoname">ILoadList</div>
      <div class="sblogotag">Equipment Rental</div>
    </div>
    <nav class="nav" id="nav">
      <div class="nvsec">
        <div class="nvlbl">Operations</div>
        <div class="nvi on" data-v="dashboard" onclick="sv('dashboard',this)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h5v5H2V2zm7 0h5v5H9V2zM2 9h5v5H2V9zm7 0h5v5H9V9z"/></svg>Dashboard
        </div>
        <div class="nvi" data-v="products" onclick="sv('products',this)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1L1 4v8l7 3 7-3V4L8 1zm0 2.2L13 5.5 8 7.8 3 5.5 8 3.2zm-6 4l5 2.2v4.5L2 11.7V7.2zm7 6.7V9.4l5-2.2v4.5L9 14z"/></svg>Products
        </div>
        <div class="nvi" data-v="hires" onclick="sv('hires',this)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h10a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1zm1 3v1.5h8V5H4zm0 3.5V10h8V8.5H4zm0 3V13h5v-1.5H4z"/></svg>Active Hires
          <span class="nvbadge" id="obadge" style="display:none">0</span>
        </div>
        <div class="nvi" data-v="reservations" onclick="sv('reservations',this)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M3 1h10a1 1 0 011 1v12a1 1 0 01-1 1H3a1 1 0 01-1-1V2a1 1 0 011-1zm1 3v1h8V4H4zm0 3v1h8V7H4zm0 3v1h5v-1H4z"/></svg>Reservations
          <span class="nvbadge" id="resbadge" style="display:none">0</span>
        </div>
        <div class="nvi" data-v="reminders" onclick="sv('reminders',this)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a5 5 0 100 10A5 5 0 008 1zm0 1.5a3.5 3.5 0 110 7 3.5 3.5 0 010-7zM7 4v4.2l2.8 1.4.7-1.4L8.5 7V4H7zm.5 9a2 2 0 002-2h-4a2 2 0 002 2z"/></svg>Reminders
          <span class="nvbadge" id="rbadge" style="display:none">!</span>
        </div>
        <div class="nvi" data-v="clients" onclick="sv('clients',this)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a3 3 0 110 6A3 3 0 018 1zm0 8c3.3 0 6 1.35 6 3v1H2v-1c0-1.65 2.7-3 6-3z"/></svg>Clients
        </div>
      </div>
      <div class="nvsec">
        <div class="nvlbl">Documents</div>
        <div class="nvi" data-v="invoices" onclick="sv('invoices',this)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M4 1h8a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V2a1 1 0 011-1zm1 3v1h6V4H5zm0 3v1h6V7H5zm0 3v1h4v-1H5z"/></svg>Invoices &amp; Docs
        </div>
        <div class="nvi" data-v="reports" onclick="sv('reports',this)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M2 10h3v5H2v-5zm4-4h3v9H6V6zm4-4h3v13h-3V2z"/></svg>Reports
        </div>
      </div>
      <div class="nvsec" id="admNav">
        <div class="nvlbl">Admin</div>
        <div class="nvi" data-v="users" onclick="sv('users',this)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 1a2.5 2.5 0 110 5 2.5 2.5 0 010-5zm5 0a2.5 2.5 0 110 5 2.5 2.5 0 010-5zM2 10c0-1.6 1.6-3 3.5-3s3.5 1.4 3.5 3v1H2v-1zm5.5 0c0-1.6 1.6-3 3.5-3S14 8.4 14 10v1h-6.5V10z"/></svg>User Management
        </div>
        <div class="nvi" data-v="actlog" onclick="sv('actlog',this)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h12v1.5H2V2zm0 3h9v1.5H2V5zm0 3h12v1.5H2V8zm0 3h7v1.5H2V11zm0 3h12V15.5H2V14z"/></svg>Activity Log
        </div>
      </div>
    </nav>
    <div class="sbfoot">
      <div class="uinf">
        <div style="position:relative">
          <div class="uav" id="sbav">MK</div>
          <div style="position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;border:2px solid var(--s);background:var(--Gm)"></div>
        </div>
        <div><div class="un" id="sbn">Mary</div><div class="ur" id="sbr">Owner</div></div>
      </div>
      <button class="btn bsm" style="width:100%" onclick="doLogout()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M11 2.5V1H2v14h9v-1.5H3.5V2.5H11zm1.3 3.7l2.2 2-2.2 2-1 1.1V9.5H6V7h5.3V5.2l1 1z"/></svg>Sign out
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="mw">
    <div class="topbar">
      <div><h1 id="pgt">Dashboard</h1><p id="pgs"><span class="odot"></span>Live</p></div>
      <div class="tbr" id="tbr">
        <button class="btn bsm" onclick="openM('mNewHire')">&#43; New Hire</button>
        <button class="btn bg bsm" onclick="sv('invoices',document.querySelector('[data-v=invoices]'))">&#43; Invoice</button>
      </div>
    </div>
    <div class="ct" id="ct">
<script src="sections/dashboard.js"></script>
<script src="sections/products.js"></script>
<script src="sections/hires.js"></script>
<script src="sections/reservations.js"></script>
<script src="sections/reminders.js"></script>
<script src="sections/clients.js"></script>
<script src="sections/invoices.js"></script>
<script src="sections/reports.js"></script>
<script src="sections/users.js"></script>
<script src="sections/activity-log.js"></script>
    </div><!-- /ct -->
  </div><!-- /mw -->
</div><!-- /sApp -->
<script src="sections/modals.js"></script>
<script src="app.js"></script>
</body>
</html>
